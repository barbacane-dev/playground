# Response-phase (phase 4) scoring. Detects a leaked credential in the response
# body and adds to tx.blocking_outbound_anomaly_score; 040-response-blocking.conf
# refuses the response once the total reaches the outbound threshold.

SecRule RESPONSE_BODY "@rx (?:AKIA|ASIA)[0-9A-Z]{16}" \
    "id:9004100,\
    phase:4,\
    pass,\
    t:none,\
    msg:'AWS access key id in response body',\
    logdata:'Matched %{MATCHED_VAR_NAME}',\
    tag:'demo/leak',\
    setvar:'tx.blocking_outbound_anomaly_score=+4'"
