# Scoring rules. Each adds to tx.blocking_inbound_anomaly_score and passes;
# 020-blocking.conf makes the blocking decision on the total. This mirrors the
# CRS structure: detection rules score, a later rule blocks on the total.

# Regex signatures, in CRS idiom. These run on any gateway build.
SecRule ARGS "@rx (?:\bunion\b\s+\bselect\b|;\s*drop\s+table|'\s*or\s*'?\d)" \
    "id:9001100,\
    phase:2,\
    pass,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SQL injection signature',\
    logdata:'Matched %{MATCHED_VAR_NAME}',\
    tag:'demo/sqli',\
    setvar:'tx.blocking_inbound_anomaly_score=+5'"

SecRule ARGS|REQUEST_HEADERS "@rx (?:<script|javascript:|onerror\s*=|<img[^>]+src)" \
    "id:9001200,\
    phase:2,\
    pass,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'Cross-site scripting signature',\
    tag:'demo/xss',\
    setvar:'tx.blocking_inbound_anomaly_score=+5'"

SecRule ARGS|REQUEST_URI "@rx (?:\.\./|/etc/passwd|/proc/self/environ)" \
    "id:9001300,\
    phase:2,\
    pass,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Path traversal signature',\
    tag:'demo/lfi',\
    setvar:'tx.blocking_inbound_anomaly_score=+5'"

# libinjection classifiers. These catch what regex signatures miss, such as the
# tautology 1' OR '1'='1, and run on the libinjectionrs port the gateway ships.
SecRule ARGS "@detectSQLi" \
    "id:9001400,\
    phase:2,\
    pass,\
    t:none,t:urlDecodeUni,\
    msg:'SQL injection (libinjection)',\
    logdata:'Fingerprint %{TX.0}',\
    tag:'demo/sqli',\
    capture,\
    setvar:'tx.blocking_inbound_anomaly_score=+5'"

SecRule ARGS "@detectXSS" \
    "id:9001500,\
    phase:2,\
    pass,\
    t:none,t:urlDecodeUni,\
    msg:'Cross-site scripting (libinjection)',\
    tag:'demo/xss',\
    setvar:'tx.blocking_inbound_anomaly_score=+5'"
