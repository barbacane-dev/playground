openapi: "3.0.3"
info:
  title: WAF Demo API
  version: "1.0.0"
  description: >
    Demonstrates the Barbacane WAF (ModSecurity / OWASP CRS compatible). The
    rule set inspects query parameters and JSON bodies for SQL injection,
    cross-site scripting and path traversal on the request, and a response
    body for a leaked credential. Rules compile at build time and seal into
    the artifact.

# Blocking mode. audit: on writes a structured record on the `waf.audit` log
# target for every inspected transaction (see it with
# `podman logs playground_barbacane_1 | grep waf.audit`). unsupported_rules:
# skip drops any rule this build cannot compile instead of failing the build.
x-barbacane-waf:
  ruleset: ./waf-rules
  paranoia_level: 1
  mode: blocking
  audit: on
  unsupported_rules: skip
  thresholds:
    inbound: 5
    outbound: 4

paths:
  /waf/search:
    get:
      summary: Free-form query the rule set inspects
      operationId: wafSearch
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"status": "ok"}'
          content_type: application/json
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /waf/submit:
    post:
      summary: JSON body the rule set inspects as phase 2 arguments
      operationId: wafSubmit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"status": "accepted"}'
          content_type: application/json
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /waf/leak:
    get:
      summary: Response whose body a phase-4 rule inspects for a leaked credential
      description: >
        The upstream returns a response body containing an AWS access key id.
        A response-phase (phase 4) rule detects it and the WAF blocks the
        response with 403 before it reaches the client, demonstrating outbound
        data-leak inspection.
      operationId: wafLeak
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"token": "AKIAIOSFODNN7EXAMPLE"}'
          content_type: application/json
      responses:
        "200":
          description: The clean response (returned only if no leak is detected)
