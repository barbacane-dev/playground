openapi: "3.0.3"
info:
  title: WAF Demo API
  version: "1.0.0"
  description: >
    Demonstrates the Barbacane WAF (ModSecurity / OWASP CRS compatible). The
    rule set inspects query parameters and JSON bodies and blocks SQL
    injection, cross-site scripting and path traversal. Rules compile at
    build time and seal into the artifact.

# The WAF runs in blocking mode. unsupported_rules: skip lets the artifact
# build on a gateway image that does not yet implement @detectSQLi/@detectXSS;
# those rules activate automatically on an image that does, with no spec change.
x-barbacane-waf:
  ruleset: ./waf-rules
  paranoia_level: 1
  mode: blocking
  unsupported_rules: skip
  thresholds:
    inbound: 5
    outbound: 4

paths:
  /waf/search:
    get:
      summary: Free-form query the rule set inspects
      operationId: wafSearch
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"status": "ok"}'
          content_type: application/json
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /waf/submit:
    post:
      summary: JSON body the rule set inspects as phase 2 arguments
      operationId: wafSubmit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"status": "accepted"}'
          content_type: application/json
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
