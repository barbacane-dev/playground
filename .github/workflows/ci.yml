name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, against the `latest` gateway image (or a newer pre-release pin),
    # to catch upstream drift.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Barbacane image tag to test (defaults to the pin in .env.example)
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve which gateway image tag this run tests: a manual run uses its input,
  # the nightly schedule uses `latest` unless the .env.example pin is a
  # pre-release (which `latest` does not move to), everything else uses the pin.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: pick
        run: |
          PIN="$(grep '^BARBACANE_VERSION=' .env.example | cut -d= -f2)"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${PIN#*-}" = "$PIN" ]; then
            TAG=latest
          else
            TAG="$PIN"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Testing Barbacane image tag: $TAG"

  # Fast gate: the specs must compile with this gateway build.
  compile:
    needs: version
    runs-on: ubuntu-latest
    env:
      BARBACANE_VERSION: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Compile the specs
        run: docker compose run --rm compiler

  # Full gate: bring up the stack and exercise every demonstrated use case.
  smoke:
    needs: version
    runs-on: ubuntu-latest
    env:
      BARBACANE_VERSION: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        # The observability viewers (Grafana/Loki/Tempo/Alloy) are not needed for
        # the smoke test; bring up only the gateway, its upstreams, the asset
        # seeder, the control plane and Prometheus. Compose pulls in each
        # service's dependencies.
        run: docker compose up -d --pull always barbacane control-plane prometheus rustfs-init

      - name: Run the smoke test
        run: bash scripts/smoke.sh

      # Every running service with a health check reports healthy: a check the
      # image cannot run (a shell command in an image without a shell) fails
      # here, though the smoke test reaches the service over HTTP.
      - name: Check the health checks
        run: |
          for container in $(docker compose ps -q); do
            name=$(docker inspect -f '{{.Name}}' "$container")
            [ -n "$(docker inspect -f '{{if .State.Health}}yes{{end}}' "$container")" ] || continue
            status=
            for _ in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$container")
              [ "$status" = healthy ] && break
              sleep 3
            done
            echo "$name: $status"
            if [ "$status" != healthy ]; then
              docker inspect -f '{{json .State.Health.Log}}' "$container"
              exit 1
            fi
          done

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: docker compose down -v
